name: Prepare-Release
description: Prepare release, usually by running the code generation.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version-file: go.mod
    - name: prepare-release
      shell: bash
      run: |
        set -eu
        make generate
