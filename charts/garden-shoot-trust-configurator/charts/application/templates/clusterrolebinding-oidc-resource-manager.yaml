apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "garden-shoot-trust-configurator.name" . }}
  labels:
{{ include "labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "garden-shoot-trust-configurator.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "garden-shoot-trust-configurator.name" . }}
  namespace: kube-system
